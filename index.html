<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>خدماتنا - تقديم طلب</title>
  <style>
    :root {
      --green: #2d6744;
      --green-dark: #205137;
      --paper: #ffffff;
      --line: #dde8e0;
      --muted: #7d8a80;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #eef3ef;
      color: #273e30;
      font-family: Tahoma, Arial, sans-serif;
      text-align: right;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 30px 16px 55px;
    }

    .hero {
      min-height: 150px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 26px 30px;
      border-radius: 26px;
      background: linear-gradient(135deg, #39794f, #1f5034);
      color: white;
      box-shadow: 0 16px 38px rgba(32, 81, 55, 0.12);
    }

    .hero h1 {
      margin: 0 0 7px;
      font-size: clamp(25px, 5vw, 36px);
    }

    .hero p {
      margin: 0;
      color: rgba(255, 255, 255, 0.82);
      font-size: 15px;
    }

    .hero-icon {
      width: 78px;
      height: 78px;
      flex: 0 0 78px;
      display: grid;
      place-items: center;
      border-radius: 21px;
      background: white;
      color: var(--green);
      font-size: 38px;
      font-weight: bold;
    }

    .card {
      margin-top: 24px;
      padding: 42px clamp(20px, 6vw, 46px);
      border: 1px solid #e7ede8;
      border-radius: 28px;
      background: var(--paper);
      box-shadow: 0 16px 45px rgba(38, 82, 53, 0.08);
    }

    .card h2 {
      margin: 0 0 34px;
      text-align: center;
      color: var(--green);
      font-size: clamp(27px, 6vw, 35px);
    }

    .field {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin: 0 4px 10px;
      color: var(--green);
      font-size: 18px;
      font-weight: 700;
      text-align: right;
    }

    .required {
      color: #b34a4a;
    }

    input {
      width: 100%;
      height: 68px;
      display: block;
      border: 2px solid var(--line);
      border-radius: 18px;
      outline: none;
      background: #fdfefd;
      color: #273e30;
      padding: 14px 18px;
      font: inherit;
      font-size: 17px;
      text-align: right;
      direction: rtl;
      transition: 0.18s;
    }

    input::placeholder {
      color: #abb4ad;
      text-align: right;
    }

    input:focus {
      border-color: #77a488;
      background: white;
      box-shadow: 0 0 0 4px rgba(45, 103, 68, 0.08);
    }

    .hint {
      margin: 8px 4px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      text-align: right;
    }

    .submit {
      width: min(100%, 330px);
      height: 70px;
      display: block;
      margin: 34px auto 0;
      border: 0;
      border-radius: 20px;
      background: linear-gradient(135deg, #34784d, var(--green-dark));
      color: white;
      box-shadow: 0 12px 25px rgba(32, 81, 55, 0.18);
      cursor: pointer;
      font: inherit;
      font-size: 21px;
      font-weight: 700;
    }

    .submit:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 14px;
      text-align: center;
      line-height: 1.8;
    }

    .status.success {
      display: block;
      background: #edf7ef;
      color: #21613a;
    }

    .status.error {
      display: block;
      background: #fff0ef;
      color: #973535;
    }

    @media (max-width: 520px) {
      .page {
        padding: 15px 10px 35px;
      }

      .hero {
        min-height: 118px;
        padding: 18px;
        border-radius: 22px;
      }

      .hero-icon {
        width: 58px;
        height: 58px;
        flex-basis: 58px;
        border-radius: 17px;
        font-size: 28px;
      }

      .card {
        margin-top: 15px;
        padding: 28px 17px;
        border-radius: 22px;
      }

      input {
        height: 62px;
        font-size: 16px;
      }

      .submit {
        height: 64px;
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="hero">
      <div>
        <h1>خدماتنا</h1>
        <p>نموذج تقديم طلب واستقبال المعلومات</p>
      </div>
      <div class="hero-icon" aria-hidden="true">✓</div>
    </header>

    <section class="card">
      <h2>تقديم الطلب</h2>

      <form id="requestForm">
        <div class="field">
          <label for="fullName">الاسم الكامل <span class="required">*</span></label>
          <input
            id="fullName"
            name="fullName"
            type="text"
            maxlength="100"
            autocomplete="name"
            placeholder="اسم مقدم الطلب"
            required
          >
        </div>

        <div class="field">
          <label for="age">العمر <span class="required">*</span></label>
          <input
            id="age"
            name="age"
            type="number"
            min="1"
            max="65"
            inputmode="numeric"
            placeholder="مثال: 35"
            required
          >
          <p class="hint">الحد الأعلى للعمر 65 سنة.</p>
        </div>

        <div class="field">
          <label for="phone">رقم الهاتف المسجل في واتساب <span class="required">*</span></label>
          <input
            id="phone"
            name="phone"
            type="tel"
            maxlength="25"
            autocomplete="tel"
            inputmode="tel"
            placeholder="أدخل رقم الهاتف"
            required
          >
          <p class="hint">أدخل رقم الهاتف بصورة صحيحة.</p>
        </div>

        <button id="submitButton" class="submit" type="submit">إرسال الطلب</button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script>
    // استبدل القيم بهذه المفاتيح قبل تجربة الإرسال.
    // لا تنشر المفاتيح الحقيقية في ملف متصفح عام.
    const PUSHOVER_USER_KEY = "PUT_USER_KEY_HERE";
    const PUSHOVER_APP_TOKEN = "PUT_APP_TOKEN_HERE";

    const form = document.getElementById("requestForm");
    const submitButton = document.getElementById("submitButton");
    const statusBox = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (
        PUSHOVER_USER_KEY === "PUT_USER_KEY_HERE" ||
        PUSHOVER_APP_TOKEN === "PUT_APP_TOKEN_HERE"
      ) {
        showStatus("error", "المفاتيح التجريبية غير مفعلة.");
        return;
      }

      const name = document.getElementById("fullName").value.trim();
      const age = Number(document.getElementById("age").value);
      const phone = document.getElementById("phone").value.trim();

      if (!name || !phone || !Number.isInteger(age) || age < 1 || age > 65) {
        showStatus("error", "يرجى التحقق من البيانات المدخلة.");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "جارٍ الإرسال…";

      const body = new URLSearchParams({
        token: PUSHOVER_APP_TOKEN,
        user: PUSHOVER_USER_KEY,
        title: "طلب جديد",
        message: `الاسم: ${name}\nالعمر: ${age}\nواتساب: ${phone}`
      });

      try {
        const response = await fetch("https://api.pushover.net/1/messages.json", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body
        });

        const result = await response.json();

        if (!response.ok || result.status !== 1) {
          throw new Error();
        }

        form.reset();
        showStatus("success", "تم إرسال طلبك بنجاح.");
      } catch {
        showStatus("error", "تعذر إرسال الطلب. تحقق من المفاتيح واتصال الإنترنت.");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "إرسال الطلب";
      }
    });

    function showStatus(type, text) {
      statusBox.className = `status ${type}`;
      statusBox.textContent = text;
    }
  </script>
</body>
</html>
