<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2d6744">
  <title>تقديم الطلب</title>

  <style>
    :root {
      --green: #2d6744;
      --green-dark: #205137;
      --line: #dfe9e1;
      --muted: #808c84;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px 12px 40px;
      background: #eef3ef;
      color: #293d30;
      font-family: Tahoma, Arial, sans-serif;
      text-align: right;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .card {
      padding: clamp(24px, 6vw, 48px);
      border-radius: 30px;
      background: #fff;
      box-shadow: 0 16px 48px rgba(34, 75, 48, .09);
    }

    h1 {
      margin: 0 0 38px;
      color: var(--green);
      text-align: center;
      font-size: clamp(30px, 7vw, 46px);
    }

    .field { margin-bottom: 28px; }

    label {
      display: block;
      margin: 0 4px 12px;
      color: var(--green);
      font-size: clamp(18px, 4.5vw, 24px);
      font-weight: 700;
      text-align: right;
    }

    .required { color: #b34a4a; }

    input {
      display: block;
      width: 100%;
      min-height: 72px;
      padding: 16px 20px;
      border: 3px solid var(--line);
      border-radius: 24px;
      outline: none;
      background: #fcfdfc;
      color: #293d30;
      font: inherit;
      font-size: 20px;
      text-align: right;
      direction: rtl;
    }

    input::placeholder {
      color: #a7afa9;
      text-align: right;
    }

    input:focus {
      border-color: #80a78b;
      box-shadow: 0 0 0 4px rgba(45, 103, 68, .08);
    }

    .hint {
      margin: 10px 5px 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
      text-align: right;
    }

    button {
      display: block;
      width: 100%;
      min-height: 86px;
      margin-top: 40px;
      border: 0;
      border-radius: 28px;
      background: linear-gradient(135deg, #39794f, var(--green-dark));
      color: white;
      box-shadow: 0 14px 28px rgba(32, 81, 55, .17);
      cursor: pointer;
      font: inherit;
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 700;
    }

    button:disabled {
      cursor: wait;
      opacity: .65;
    }

    .status {
      display: none;
      margin-top: 22px;
      padding: 20px 16px;
      border-radius: 22px;
      font-size: 18px;
      line-height: 1.8;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .status.success {
      display: block;
      background: #edf7ef;
      color: #21613a;
    }

    .status.error {
      display: block;
      background: #fff0ef;
      color: #973535;
    }

    @media (max-width: 480px) {
      body { padding: 10px 8px 28px; }
      .card { border-radius: 24px; }
      input { min-height: 64px; border-radius: 21px; font-size: 18px; }
      button { min-height: 72px; border-radius: 23px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">
      <h1>تقديم الطلب</h1>

      <form id="requestForm">
        <div class="field">
          <label for="fullName">الاسم الكامل <span class="required">*</span></label>
          <input
            id="fullName"
            name="fullName"
            type="text"
            maxlength="100"
            autocomplete="name"
            placeholder="اسم مقدم الطلب"
            required
          >
        </div>

        <div class="field">
          <label for="age">العمر <span class="required">*</span></label>
          <input
            id="age"
            name="age"
            type="number"
            min="1"
            max="65"
            inputmode="numeric"
            placeholder="مثال: 30"
            required
          >
          <p class="hint">الحد الأعلى للعمر 65 سنة.</p>
        </div>

        <div class="field">
          <label for="phone">رقم الهاتف المسجل في واتساب <span class="required">*</span></label>
          <input
            id="phone"
            name="phone"
            type="tel"
            maxlength="25"
            autocomplete="tel"
            inputmode="tel"
            placeholder="أدخل رقم الهاتف"
            required
          >
          <p class="hint">أدخل رقم الهاتف بصورة صحيحة.</p>
        </div>

        <button id="submitButton" type="submit">إرسال الطلب</button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script>
    // مفاتيح التجربة التي أرسلتها
    const PUSHOVER_APP_TOKEN = "a1i47tapxjska68ppeuv5sz7n7k549";
    const PUSHOVER_USER_KEY = "ui9s8fpr41hf3qvnydb2dx7u6cru8b";

    const form = document.getElementById("requestForm");
    const button = document.getElementById("submitButton");
    const statusBox = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault(); // يمنع تحديث الصفحة ويبدأ إرسال الطلب

      const name = document.getElementById("fullName").value.trim();
      const age = Number(document.getElementById("age").value);
      const phone = document.getElementById("phone").value.trim();

      if (!name || !Number.isInteger(age) || age < 1 || age > 65 || !phone) {
        showStatus("error", "تحقق من الاسم والعمر ورقم الهاتف.");
        return;
      }

      button.disabled = true;
      button.textContent = "جارٍ إرسال الطلب…";
      statusBox.className = "status";
      statusBox.textContent = "";

      const data = new URLSearchParams();
      data.set("token", PUSHOVER_APP_TOKEN);
      data.set("user", PUSHOVER_USER_KEY);
      data.set("title", "طلب جديد");
      data.set("message", `الاسم: ${name}\nالعمر: ${age}\nرقم واتساب: ${phone}`);
      data.set("priority", "0");

      try {
        const response = await fetch("https://api.pushover.net/1/messages.json", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
          },
          body: data.toString()
        });

        const responseText = await response.text();
        let result;

        try {
          result = JSON.parse(responseText);
        } catch {
          throw new Error("استجابة غير مفهومة من Pushover.");
        }

        if (!response.ok || result.status !== 1) {
          const details = Array.isArray(result.errors)
            ? result.errors.join("، ")
            : "تحقق من مفاتيح Pushover.";
          throw new Error(details);
        }

        form.reset();
        showStatus("success", "تم إرسال الطلب بنجاح إلى Pushover.");
      } catch (error) {
        console.error("Pushover error:", error);
        const message = error instanceof TypeError
          ? "تعذر الاتصال بـ Pushover من المتصفح. إذا استمر ذلك، فالإرسال يحتاج API خادماً وسيطاً."
          : `لم يتم الإرسال: ${error.message}`;
        showStatus("error", message);
      } finally {
        button.disabled = false;
        button.textContent = "إرسال الطلب";
      }
    });

    function showStatus(type, message) {
      statusBox.className = `status ${type}`;
      statusBox.textContent = message;
    }
  </script>
</body>
</html>
